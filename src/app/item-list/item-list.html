<div class="container list-page">
  <h1 class="section-title">{{ 'items.browseTitle' | translate }}</h1>

  <div class="filters">
    <input
      type="text"
      class="form-control search-input"
      [placeholder]="'items.searchPlaceholder' | translate"
      [value]="searchQuery()"
      (input)="onSearch($event)"
    />

    <div class="filter-row">
      <div class="type-toggle">
        <button
          class="toggle-btn"
          [class.active]="typeFilter() === 'all'"
          (click)="setTypeFilter('all')"
        >{{ 'items.filterAll' | translate }}</button>
        <button
          class="toggle-btn toggle-lost"
          [class.active]="typeFilter() === 'lost'"
          (click)="setTypeFilter('lost')"
        >{{ 'items.filterLost' | translate }}</button>
        <button
          class="toggle-btn toggle-found"
          [class.active]="typeFilter() === 'found'"
          (click)="setTypeFilter('found')"
        >{{ 'items.filterFound' | translate }}</button>
      </div>

      <select
        class="form-control category-select"
        [value]="categoryFilter()"
        (change)="onCategoryChange($event)"
      >
        <option value="">{{ 'items.allCategories' | translate }}</option>
        @for (cat of categories; track cat) {
          <option [value]="cat">{{ 'category.' + cat | translate }}</option>
        }
      </select>
    </div>
  </div>

  @if (filteredItems().length > 0) {
    <div class="items-grid">
      @for (item of filteredItems(); track item.id) {
        <app-item-card [item]="item" />
      }
    </div>
  } @else {
    <div class="empty-state">
      <p class="empty-state-text">{{ 'items.emptyState' | translate }}</p>
      <a routerLink="/report" class="btn btn-primary">{{ 'items.reportItem' | translate }}</a>
    </div>
  }
</div>
